<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DATE NOTE</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000000;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Cinzel', serif;
        }

        /* ৩ সেকেন্ডের স্প্ল্যাশ স্ক্রিন (Cover.png দেখাবে) */
        #splashScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.8s ease;
        }

        #splashScreen img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* পুরো স্ক্রিন জুড়ে ছবিটি দেখানোর জন্য */
        }

        /* মূল লেখার পেজ */
        #mainApp {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100%;
            background-color: #0b0b0b;
            padding: 10px;
            box-sizing: border-box;
        }

        .header-title {
            color: #fff;
            font-size: 1.5rem;
            margin: 10px 0;
            letter-spacing: 2px;
        }

        /* অ্যানিমে স্টাইল খাতার ক্যানভাস */
        .notebook-page {
            background-color: #111111;
            border: 2px solid #222;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.9);
            position: relative;
            cursor: crosshair;
            touch-action: none;
        }

        canvas {
            display: block;
            background: #141414;
        }

        /* কন্ট্রোল বাটন */
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 15px;
        }

        button {
            background: #1a1a1a;
            color: #fff;
            border: 1px solid #444;
            padding: 10px 20px;
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            cursor: pointer;
            letter-spacing: 1px;
            transition: 0.2s;
        }

        button:hover {
            background: #333;
            border-color: #777;
        }
    </style>
</head>
<body>

    <!-- Cover.png ইমেজ সহ স্প্ল্যাশ স্ক্রিন -->
    <div id="splashScreen">
        <img src="Cover.png" alt="Date Note Splash">
    </div>

    <!-- মূল লেখার পেজ -->
    <div id="mainApp">
        <div class="header-title">DATE NOTE</div>
        
        <div class="notebook-page">
            <canvas id="noteCanvas"></canvas>
        </div>

        <div class="controls">
            <button onclick="clearCanvas()">CLEAR PAGE</button>
            <button onclick="saveCanvas()">SAVE NOTE</button>
        </div>
    </div>

    <script>
        // ৩ সেকেন্ড পর স্প্ল্যাশ স্ক্রিন ফেড-আউট হয়ে মেইন নোট পেজ ওপেন হবে
        setTimeout(() => {
            const splash = document.getElementById("splashScreen");
            splash.style.opacity = "0";
            setTimeout(() => {
                splash.style.display = "none";
                document.getElementById("mainApp").style.display = "flex";
                initCanvas();
            }, 800);
        }, 3000);

        let canvas, ctx;
        let isDrawing = false;

        function initCanvas() {
            canvas = document.getElementById("noteCanvas");
            ctx = canvas.getContext("2d");

            let screenWidth = window.innerWidth > 500 ? 450 : window.innerWidth - 40;
            let screenHeight = window.innerHeight > 700 ? 500 : window.innerHeight - 150;

            canvas.width = screenWidth;
            canvas.height = screenHeight;

            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 3;
            ctx.lineCap = "round";
            ctx.lineJoin = "round";

            canvas.addEventListener("mousedown", startDrawing);
            canvas.addEventListener("mousemove", draw);
            canvas.addEventListener("mouseup", stopDrawing);
            canvas.addEventListener("mouseleave", stopDrawing);

            canvas.addEventListener("touchstart", handleTouch);
            canvas.addEventListener("touchmove", handleTouch);
            canvas.addEventListener("touchend", stopDrawing);
        }

        function getPosition(e) {
            let rect = canvas.getBoundingClientRect();
            if (e.touches) {
                return {
                    x: e.touches[0].clientX - rect.left,
                    y: e.touches[0].clientY - rect.top
                };
            } else {
                return {
                    x: e.clientX - rect.left,
                    y: e.clientY - rect.top
                };
            }
        }

        function startDrawing(e) {
            isDrawing = true;
            let pos = getPosition(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
            e.preventDefault();
        }

        function draw(e) {
            if (!isDrawing) return;
            let pos = getPosition(e);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            e.preventDefault();
        }

        function handleTouch(e) {
            if (e.type === "touchstart") {
                startDrawing(e);
            } else if (e.type === "touchmove") {
                draw(e);
            }
        }

        function stopDrawing() {
            isDrawing = false;
        }

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function saveCanvas() {
            let link = document.createElement('a');
            link.download = 'date-note.png';
            link.href = canvas.toDataURL();
            link.click();
        }
    </script>

</body>
</html>
